# Production stack for a single Oracle Cloud Free Tier VM. See DEPLOYMENT.md
# for the full step-by-step guide this file is part of.
#
# Usage (from the repo root, on the server):
#   docker compose -f docker-compose.prod.yml --env-file .env.prod build
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#
# All five services run on one box: Postgres and Redis are containers with
# their own persistent volumes (backed by the VM's block storage, which
# survives reboots and container recreation — see DEPLOYMENT.md's note on
# why a separate object-storage migration isn't a blocker for this
# single-instance deployment). Caddy terminates TLS (or plain HTTP if you
# haven't pointed a domain at the server yet) and reverse-proxies to the
# api and web containers, which are not exposed to the host directly.

services:
  postgres:
    image: postgres:16.4-alpine
    security_opt: [no-new-privileges:true]
    container_name: alnajoum-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]

  # Redis was deployed here with no password and nothing in the application uses it (Phase 22 removed it;
  # add it back WITH `--requirepass` if a feature ever needs it).

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: alnajoum-api
    restart: unless-stopped
    # Phase 22 container hardening: no extra privileges, no Linux capabilities, read-only root filesystem
    # (the uploads/backups volumes and /tmp stay writable), bounded memory.
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    pids_limit: 512
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      # Caddy is the single reverse-proxy hop in front of the API.
      TRUST_PROXY_HOPS: 1
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      DATA_ENCRYPTION_KEYS: ${DATA_ENCRYPTION_KEYS:-}
      DATA_ENCRYPTION_KEY_ID: ${DATA_ENCRYPTION_KEY_ID:-}
      CORS_ORIGIN: ${PUBLIC_ORIGIN}
      UPLOADS_DIR: /repo/apps/api/uploads
      BACKUPS_DIR: /repo/apps/api/backups
      NOTIFICATION_PROVIDER: ${NOTIFICATION_PROVIDER:-mock}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      CONTACT_RECIPIENT_EMAIL: ${CONTACT_RECIPIENT_EMAIL:-alnajoumtravelagency@gmail.com}
      # No :-mock default: the API refuses to start in production on a mock payment provider.
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-}
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-meta}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
      OPAY_SECRET_KEY: ${OPAY_SECRET_KEY:-}
      OPAY_MERCHANT_ID: ${OPAY_MERCHANT_ID:-}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      AI_API_KEY: ${AI_API_KEY:-}
      # Same origin as the public site — this is a single-origin deployment
      # (see deploy/Caddyfile), so the checkout callback URL is just
      # PUBLIC_ORIGIN itself, not a separate value to configure.
      PUBLIC_WEB_ORIGIN: ${PUBLIC_ORIGIN}
      # Phase 26 Communication Centre. Single-origin: the API is reached at the same address as the site, which is
      # what the one-click unsubscribe link in emails points at.
      PUBLIC_API_ORIGIN: ${PUBLIC_ORIGIN}
      COMM_PUBLIC_COMPANY_ID: ${COMM_PUBLIC_COMPANY_ID:-}
      COMM_EMAIL_WEBHOOK_SECRET: ${COMM_EMAIL_WEBHOOK_SECRET:-}
    volumes:
      - uploads_data:/repo/apps/api/uploads
      - backups_data:/repo/apps/api/backups
    networks: [internal]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Baked into the client bundle at build time — must be the public
        # URL browsers will actually use (your domain, or http://<vm-ip>
        # if you don't have a domain yet). Changing it later requires
        # rebuilding this image, not just restarting the container.
        NEXT_PUBLIC_API_URL: ${PUBLIC_ORIGIN}
    container_name: alnajoum-web
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp, /app/apps/web/.next/cache]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    pids_limit: 256
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    depends_on: [api]
    environment:
      NODE_ENV: production
      PORT: 3000
    networks: [internal]

  caddy:
    image: caddy:2.8.4-alpine
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    container_name: alnajoum-caddy
    restart: unless-stopped
    depends_on: [api, web]
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [internal]

networks:
  internal:

volumes:
  postgres_data:
  uploads_data:
  backups_data:
  caddy_data:
  caddy_config:
