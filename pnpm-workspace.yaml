packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  argon2: true
  prisma: true
  sharp: true
  unrs-resolver: true
# Phase 22 - security overrides for vulnerable TRANSITIVE dependencies found by `pnpm audit --prod`.
# Each pin is the first patched release of the same major line; remove an entry once the upstream
# package that pulls it in has moved past it.
overrides:
  proxy-addr: '>=2.0.8'
  multer: '>=2.4.0'
  qs: '>=6.16.0'
  source-map-js: '>=1.2.2'
  'nanoid@3': '^3.3.18'
