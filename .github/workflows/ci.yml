name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    name: Lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter api prisma:generate

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

  test:
    name: Test (unit + e2e)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: alnajoum
          POSTGRES_PASSWORD: alnajoum_dev_password
          POSTGRES_DB: alnajoum_erp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alnajoum"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter api prisma:generate

      - name: Run unit tests
        run: pnpm --filter api test

      # apps/api/test/global-setup.ts applies migrations + seeds the test DB
      # by reading apps/api/.env.test directly, which is why no DATABASE_URL
      # env var is set here — it must match .env.test's Postgres credentials
      # and the alnajoum_erp_test database name (see the `postgres` service
      # config above).
      - name: Run e2e tests
        run: pnpm --filter api test:e2e
